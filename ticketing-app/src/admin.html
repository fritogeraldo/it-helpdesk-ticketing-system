<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IT Helpdesk — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
    <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-xl mb-4">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Admin Login</h1>
        <p class="text-gray-400 text-sm mt-1">IT Helpdesk Panel</p>
      </div>
      <form id="loginForm">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="loginEmail" type="email" placeholder="agent@company.com"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
        </div>
        <div id="loginError" class="hidden text-red-600 text-sm mb-4 bg-red-50 rounded-lg px-4 py-2"></div>
        <button type="submit" id="loginBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
          <span id="loginBtnText">Sign In</span>
          <svg id="loginSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col shadow-sm">
      <div class="px-6 py-5 border-b border-gray-100">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </div>
          <div>
            <p class="font-bold text-gray-900 text-sm">IT Helpdesk</p>
            <p class="text-xs text-gray-400" id="agentEmail"></p>
          </div>
        </div>
      </div>

      <nav class="flex-1 px-3 py-4 space-y-1">
        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2">Filter by Status</p>
        <button onclick="filterTickets('all')" class="sidebar-item active w-full text-left px-3 py-2 rounded-lg text-sm flex justify-between items-center transition" data-filter="all">
          All Tickets <span id="count-all" class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="filterTickets('Open')" class="sidebar-item w-full text-left px-3 py-2 rounded-lg text-sm flex justify-between items-center transition hover:bg-gray-50" data-filter="Open">
          Open <span id="count-Open" class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="filterTickets('In Progress')" class="sidebar-item w-full text-left px-3 py-2 rounded-lg text-sm flex justify-between items-center transition hover:bg-gray-50" data-filter="In Progress">
          In Progress <span id="count-InProgress" class="text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="filterTickets('Resolved')" class="sidebar-item w-full text-left px-3 py-2 rounded-lg text-sm flex justify-between items-center transition hover:bg-gray-50" data-filter="Resolved">
          Resolved <span id="count-Resolved" class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
        <button onclick="filterTickets('Closed')" class="sidebar-item w-full text-left px-3 py-2 rounded-lg text-sm flex justify-between items-center transition hover:bg-gray-50" data-filter="Closed">
          Closed <span id="count-Closed" class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
      </nav>

      <div class="px-4 py-4 border-t border-gray-100">
        <button onclick="logout()" class="w-full text-left text-sm text-gray-400 hover:text-red-500 flex items-center gap-2 px-2 py-2 rounded-lg hover:bg-red-50 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto">
      <div class="p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-2xl font-bold text-gray-900">Tickets</h2>
            <p class="text-gray-400 text-sm" id="filterLabel">All tickets</p>
          </div>
          <div class="flex items-center gap-3">
            <div class="relative">
              <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <input id="searchInput" type="text" placeholder="Search tickets…" oninput="renderTable()"
                class="pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 transition"/>
            </div>
            <button onclick="loadTickets()" class="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1 px-3 py-2 rounded-lg hover:bg-blue-50 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
              Refresh
            </button>
          </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <table class="w-full">
            <thead>
              <tr class="border-b border-gray-100 bg-gray-50">
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Ticket ID</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Submitter</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Subject</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Category</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Priority</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Status</th>
                <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</th>
                <th class="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody id="ticketTableBody">
              <tr><td colspan="8" class="text-center py-12 text-gray-400">Loading tickets…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Ticket Detail Modal -->
  <div id="ticketModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h3 class="font-bold text-gray-900 text-lg" id="modalTicketId"></h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="px-6 py-5">
        <div class="grid grid-cols-2 gap-4 mb-5">
          <div><p class="text-xs text-gray-400 mb-1">Submitter</p><p class="font-semibold text-gray-800" id="mName"></p><p class="text-sm text-gray-500" id="mEmail"></p></div>
          <div><p class="text-xs text-gray-400 mb-1">Category / Priority</p><p class="font-semibold text-gray-800" id="mCatPri"></p></div>
        </div>
        <div class="mb-4">
          <p class="text-xs text-gray-400 mb-1">Subject</p>
          <p class="font-semibold text-gray-900" id="mSubject"></p>
        </div>
        <div class="mb-6">
          <p class="text-xs text-gray-400 mb-1">Description</p>
          <p class="text-sm text-gray-600 leading-relaxed bg-gray-50 rounded-lg p-4" id="mDescription"></p>
        </div>

        <div class="border-t border-gray-100 pt-5 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
            <select id="mStatus" class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Assign To (Agent Name)</label>
            <input id="mAssigned" type="text" placeholder="e.g. John Santos"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Internal Notes <span class="text-gray-400 font-normal">(not visible to user)</span></label>
            <textarea id="mNotes" rows="3" placeholder="Add internal notes here…"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none transition"></textarea>
          </div>
        </div>

        <div id="modalError" class="hidden mt-3 text-red-600 text-sm bg-red-50 rounded-lg px-4 py-2"></div>

        <div class="flex justify-end gap-3 mt-5">
          <button onclick="closeModal()" class="px-5 py-2.5 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50 transition">Cancel</button>
          <button onclick="saveTicket()" id="saveBtn"
            class="px-6 py-2.5 text-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition flex items-center gap-2">
            <span id="saveBtnText">Save & Notify User</span>
            <svg id="saveSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://agent-orange-c809ca9b.base44.app/functions';
    let authToken = sessionStorage.getItem('adminToken') || null;
    let currentFilter = 'all';
    let allTickets = [];
    let activeTicket = null;

    const statusBadge = {
      'Open':        'bg-green-100 text-green-700',
      'In Progress': 'bg-yellow-100 text-yellow-700',
      'Resolved':    'bg-blue-100 text-blue-700',
      'Closed':      'bg-gray-100 text-gray-500',
    };
    const priorityColor = { Low: 'text-green-600', Medium: 'text-yellow-600', High: 'text-red-600' };

    // Boot
    if (authToken) {
      showAdmin();
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');

      document.getElementById('loginBtnText').textContent = 'Signing in…';
      document.getElementById('loginSpinner').classList.remove('hidden');
      document.getElementById('loginBtn').disabled = true;

      try {
        const res = await fetch(`${API_BASE}/adminLogin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Invalid credentials');
        authToken = data.token;
        sessionStorage.setItem('adminToken', authToken);
        sessionStorage.setItem('adminEmail', email);
        showAdmin();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        document.getElementById('loginBtnText').textContent = 'Sign In';
        document.getElementById('loginSpinner').classList.add('hidden');
        document.getElementById('loginBtn').disabled = false;
      }
    });

    function showAdmin() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      document.getElementById('agentEmail').textContent = sessionStorage.getItem('adminEmail') || 'Admin';
      loadTickets();
    }

    function logout() {
      sessionStorage.removeItem('adminToken');
      sessionStorage.removeItem('adminEmail');
      authToken = null;
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    async function loadTickets() {
      try {
        const res = await fetch(`${API_BASE}/adminGetTickets`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
          body: JSON.stringify({})
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error);
        allTickets = data.tickets || [];
        updateCounts();
        renderTable();
      } catch (err) {
        document.getElementById('ticketTableBody').innerHTML =
          `<tr><td colspan="8" class="text-center py-12 text-red-400">${err.message}</td></tr>`;
      }
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = allTickets.length;
      ['Open','In Progress','Resolved','Closed'].forEach(s => {
        const id = 'count-' + s.replace(' ','');
        document.getElementById(id).textContent = allTickets.filter(t => t.status === s).length;
      });
    }

    function filterTickets(filter) {
      currentFilter = filter;
      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.toggle('active', el.dataset.filter === filter);
      });
      const labels = { all: 'All tickets', Open: 'Open tickets', 'In Progress': 'In Progress', Resolved: 'Resolved tickets', Closed: 'Closed tickets' };
      document.getElementById('filterLabel').textContent = labels[filter] || filter;
      renderTable();
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allTickets.filter(t => {
        if (currentFilter !== 'all' && t.status !== currentFilter) return false;
        if (search && !`${t.ticket_id} ${t.name} ${t.subject} ${t.email}`.toLowerCase().includes(search)) return false;
        return true;
      });

      if (filtered.length === 0) {
        document.getElementById('ticketTableBody').innerHTML =
          `<tr><td colspan="8" class="text-center py-12 text-gray-400">No tickets found.</td></tr>`;
        return;
      }

      document.getElementById('ticketTableBody').innerHTML = filtered.map(t => `
        <tr class="border-b border-gray-50 hover:bg-blue-50/40 transition cursor-pointer" onclick="openTicket('${t.ticket_id}')">
          <td class="px-5 py-3 text-sm font-mono font-bold text-blue-700">${t.ticket_id}</td>
          <td class="px-5 py-3">
            <p class="text-sm font-medium text-gray-900">${t.name}</p>
            <p class="text-xs text-gray-400">${t.email}</p>
          </td>
          <td class="px-5 py-3 text-sm text-gray-700 max-w-xs truncate">${t.subject}</td>
          <td class="px-5 py-3 text-sm text-gray-500">${t.category}</td>
          <td class="px-5 py-3 text-sm font-semibold ${priorityColor[t.priority] || ''}">${t.priority}</td>
          <td class="px-5 py-3">
            <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${statusBadge[t.status] || 'bg-gray-100 text-gray-500'}">${t.status}</span>
          </td>
          <td class="px-5 py-3 text-xs text-gray-400">${new Date(t.created_date).toLocaleDateString()}</td>
          <td class="px-5 py-3">
            <button class="text-blue-600 hover:text-blue-800 text-xs font-medium">View →</button>
          </td>
        </tr>
      `).join('');
    }

    function openTicket(ticketId) {
      activeTicket = allTickets.find(t => t.ticket_id === ticketId);
      if (!activeTicket) return;
      document.getElementById('modalTicketId').textContent = activeTicket.ticket_id;
      document.getElementById('mName').textContent = activeTicket.name;
      document.getElementById('mEmail').textContent = activeTicket.email;
      document.getElementById('mCatPri').textContent = `${activeTicket.category} · ${activeTicket.priority}`;
      document.getElementById('mSubject').textContent = activeTicket.subject;
      document.getElementById('mDescription').textContent = activeTicket.description;
      document.getElementById('mStatus').value = activeTicket.status;
      document.getElementById('mAssigned').value = activeTicket.assigned_to || '';
      document.getElementById('mNotes').value = activeTicket.internal_notes || '';
      document.getElementById('modalError').classList.add('hidden');
      document.getElementById('ticketModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('ticketModal').classList.add('hidden');
      activeTicket = null;
    }

    async function saveTicket() {
      if (!activeTicket) return;
      const errEl = document.getElementById('modalError');
      errEl.classList.add('hidden');
      document.getElementById('saveBtnText').textContent = 'Saving…';
      document.getElementById('saveSpinner').classList.remove('hidden');
      document.getElementById('saveBtn').disabled = true;

      try {
        const res = await fetch(`${API_BASE}/adminUpdateTicket`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
          body: JSON.stringify({
            ticket_id: activeTicket.ticket_id,
            status: document.getElementById('mStatus').value,
            assigned_to: document.getElementById('mAssigned').value,
            internal_notes: document.getElementById('mNotes').value,
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Update failed');
        closeModal();
        await loadTickets();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        document.getElementById('saveBtnText').textContent = 'Save & Notify User';
        document.getElementById('saveSpinner').classList.add('hidden');
        document.getElementById('saveBtn').disabled = false;
      }
    }
  </script>
</body>
</html>
